name: QGIS regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qgis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install distribution QGIS and PyQGIS
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-qgis qgis qttools5-dev-tools

      - name: Report tested QGIS version
        run: /usr/bin/python3 -c 'from qgis.core import Qgis; print(Qgis.QGIS_VERSION)'

      - name: Check package reproducibility and release metadata
        run: /usr/bin/python3 tests/test_package.py

      - name: Check loaded version snapshots
        run: /usr/bin/python3 tests/test_version.py

      - name: Run plugin regression tests
        run: /usr/bin/python3 tests/test_plugin_regressions.py

      - name: Check dock controls and workflow navigation
        run: /usr/bin/python3 tests/test_dock_panel.py

      - name: Check translation lifecycle and catalogs
        run: /usr/bin/python3 tests/test_i18n.py

      - name: Check bilingual workflows and compact layout
        run: /usr/bin/python3 tests/test_localized_workflows.py

      - name: Check bilingual workflows at 150 percent scale
        env:
          QT_SCALE_FACTOR: '1.5'
        run: /usr/bin/python3 tests/test_localized_workflows.py

      - name: Run original exporter smoke tests
        run: /usr/bin/python3 tests/test_plan_exporter.py

  qgis4:
    name: QGIS 4 / Qt6
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      options: --user 0
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu@sha256:c96df111845eb0c86ad56364fb792d35fa6931e01d3d629d2b1bc6388ed43ece
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt6 translation test tools
        run: |
          apt-get update
          apt-get install --no-install-recommends -y qt6-l10n-tools xvfb xauth
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
      - name: Require QGIS 4 and Qt6
        run: |
          python3 - <<'PYTHON'
          from qgis.core import Qgis
          from qgis.PyQt.QtCore import QT_VERSION_STR
          print('QGIS', Qgis.QGIS_VERSION, 'Qt', QT_VERSION_STR, flush=True)
          assert Qgis.QGIS_VERSION_INT >= 40000
          assert QT_VERSION_STR.startswith('6.')
          PYTHON
      - name: Check Qt6 migration
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile /tmp/abs-qt6-check.log auto_buffer_sketcher
          cat /tmp/abs-qt6-check.log
          pyqt5_to_pyqt6.py auto_buffer_sketcher
      - name: Check package and loaded version
        run: |
          python3 tests/test_package.py
          python3 tests/test_version.py
      - name: Check route, buffer, persistence and export regressions
        run: python3 tests/test_plugin_regressions.py
      - name: Check dock, translations and bilingual workflows
        run: |
          python3 tests/test_dock_panel.py
          python3 tests/test_i18n.py
          python3 tests/test_localized_workflows.py
      - name: Check bilingual workflows at 150 percent scale
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python3 tests/test_localized_workflows.py
      - name: Check original exporters
        run: python3 tests/test_plan_exporter.py
      - name: Install packaged plugin in a clean native QGIS profile
        run: |
          export ABS_NATIVE_ROOT="$(mktemp -d /tmp/abs-native-XXXXXX)"
          python3 scripts/build_plugin.py --output "$ABS_NATIVE_ROOT/package"
          export ABS_NATIVE_ZIP="$ABS_NATIVE_ROOT/package/ABS_AutoBufferSketcher_0.3.0.zip"
          export ABS_NATIVE_RESULT="$ABS_NATIVE_ROOT/result.json"
          if ! timeout 90 xvfb-run -a qgis --profiles-path "$ABS_NATIVE_ROOT/profiles" --profile ABS-native --nologo --noplugins --noversioncheck --code "$GITHUB_WORKSPACE/tests/native_qgis_install.py" > "$ABS_NATIVE_ROOT/qgis.log" 2>&1; then
            cat "$ABS_NATIVE_ROOT/qgis.log"
            exit 1
          fi
          cat "$ABS_NATIVE_ROOT/qgis.log"
          cat "$ABS_NATIVE_RESULT"
          python3 -c 'import json,os; assert json.load(open(os.environ["ABS_NATIVE_RESULT"]))["passed"]'
