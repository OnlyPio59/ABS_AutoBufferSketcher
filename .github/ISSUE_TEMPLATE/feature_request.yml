name: Proposta di miglioramento
description: Proponi un miglioramento spiegando il caso d’uso.
title: "[Proposta] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Quale attività vuoi migliorare?
    validations:
      required: true
  - type: textarea
