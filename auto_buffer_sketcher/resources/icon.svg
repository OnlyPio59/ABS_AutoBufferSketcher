<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title id="title">ABS - AutoBufferSketcher</title>
  <desc id="desc">Tre ovali intersecati nei colori dei buffer: rosso sopra, giallo al centro e verde sotto, con perimetri vivaci e riempimenti trasparenti.</desc>
  <rect width="128" height="128" rx="20" fill="#18212F"/>
  <g stroke="none">
    <ellipse cx="64" cy="41" rx="47" ry="22" fill="#DC143C" fill-opacity="0.18"/>
    <ellipse cx="64" cy="71" rx="36" ry="18" fill="#FFD700" fill-opacity="0.22"/>
    <ellipse cx="64" cy="95" rx="24" ry="13" fill="#22C55E" fill-opacity="0.28"/>
  </g>
  <g fill="none" stroke-width="5">
    <ellipse cx="64" cy="41" rx="47" ry="22" stroke="#DC143C"/>
    <ellipse cx="64" cy="71" rx="36" ry="18" stroke="#FFD700"/>
    <ellipse cx="64" cy="95" rx="24" ry="13" stroke="#22C55E"/>
  </g>
</svg>
